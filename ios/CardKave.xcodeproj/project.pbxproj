			shellPath = /bin/sh;
			shellScript = "# Copies the CardKave web app from the repo root into the app bundle's www/\n# folder on every build, so the iOS shell always runs the latest web code.\n# No 'set -e': the final xattr cleanup must ALWAYS run so codesign accepts the\n# bundle, even if a copy step hiccups. cp -X / --no-xattrs avoid copying the\n# Finder metadata that codesign rejects in the first place.\nSRC=\"${SRCROOT}/..\"\nAPP=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nDST=\"${APP}/www\"\nrm -rf \"${DST}\"\nmkdir -p \"${DST}/data\"\nfor f in index.html app.js styles.css cloud-sync.js firebase-config.js; do\n  cp -fX \"${SRC}/${f}\" \"${DST}/${f}\"\ndone\nrsync -rltD --delete --no-xattrs --exclude '.DS_Store' \"${SRC}/data/\" \"${DST}/data/\" || cp -RfX \"${SRC}/data/.\" \"${DST}/data/\"\nfind \"${DST}\" -name '.DS_Store' -delete 2>/dev/null\n# Strip Finder info / resource forks so codesign accepts the bundle.\nxattr -cr \"${APP}\" 2>/dev/null\necho \"Copied CardKave web assets into ${DST}\"\nexit 0\n";
		};
